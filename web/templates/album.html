<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Фотоальбом дейлика</title><link rel="stylesheet" href="/static/album.css?v=__PHOTO_ASSET_VERSION__"></head>
<body><header><a id="albumBack" href="/?panel=daily" aria-label="Вернуться в ДейлиЖанс" title="Вернуться в ДейлиЖанс" hidden>←</a><h1 id="albumTitle">Фотоальбом</h1><button id="albumLogin">Войти для управления</button></header>
<p id="albumStatus" role="status"></p><main id="albumGrid" aria-label="Фотографии"></main><button id="albumMore" hidden>Показать ещё</button>
<dialog id="albumViewer" aria-label="Просмотр фотографии"><div class="viewer-toolbar"><span id="albumCounter"></span><button id="photoMenuButton" aria-label="Действия с фотографией" hidden>⋮</button><button id="viewerClose" aria-label="Закрыть">×</button></div><div id="photoMenu" hidden><button id="photoMove" hidden>Переместить</button><button id="photoDelete" hidden>Удалить</button></div><div class="viewer-stage"><img id="viewerImage" alt="Фото с дейлика"><button id="photoPrev" aria-label="Предыдущее фото"><span>‹</span></button><button id="photoNext" aria-label="Следующее фото"><span>›</span></button><span id="photoLoadStatus" role="status" hidden></span></div><div id="albumStrip" aria-label="Лента фотографий"></div></dialog>
<dialog id="albumConfirm"><p id="confirmText"></p><button id="confirmCancel">Отмена</button><button id="confirmYes">Удалить</button></dialog>
<script src="/static/album.js?v=__PHOTO_ASSET_VERSION__"></script></body></html>
