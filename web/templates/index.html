<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UDB Web</title>
    <link rel="icon" type="image/png" sizes="48x48" href="/static/favicon-48x48.png">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="scene" id="sceneRoot" aria-hidden="true">
    <div class="scene-layer scene-layer-sky" data-scene-layer="sky"></div>
    <div class="scene-layer scene-layer-sky-elements" data-scene-layer="sky_elements"></div>
    <div class="scene-layer scene-layer-background" data-scene-layer="background"></div>
    <div class="scene-layer scene-layer-foreground" data-scene-layer="foreground"></div>
    <div class="scene-night-filter" id="sceneNightFilter"></div>
</div>
<div class="backdrop"></div>
<div class="screen-loader hidden" id="screenLoader" role="status" aria-live="polite" aria-label="Загрузка">
    <div class="screen-loader-spinner"></div>
</div>
<div class="scene-tooltip hidden" id="sceneTooltip" role="status" aria-live="polite">
    <div class="scene-tooltip-title" id="sceneTooltipTitle"></div>
    <div class="scene-tooltip-meta" id="sceneTooltipMeta"></div>
</div>

<header class="app-header hidden" id="appHeader">
    <div class="header-left">
        <div class="brand">УРАЛ / ДИЗАЙН / БАЗА</div>
        <button
            id="buildingsToggleBtn"
            class="tool-toggle-btn"
            type="button"
            aria-label="Панель зданий"
            aria-pressed="false"
            title="Панель зданий"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 20V8h7v12H4Zm9 0V4h7v16h-7ZM6 18h3v-8H6v8Zm9 0h3V6h-3v12Z"></path>
            </svg>
        </button>
        <button
            id="playersToggleBtn"
            class="tool-toggle-btn"
            type="button"
            aria-label="Список игроков"
            aria-pressed="false"
            title="Список игроков"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M16 11c1.66 0 3-1.57 3-3.5S17.66 4 16 4s-3 1.57-3 3.5 1.34 3.5 3 3.5Zm-8 0c1.66 0 3-1.57 3-3.5S9.66 4 8 4 5 5.57 5 7.5 6.34 11 8 11Zm0 2c-2.33 0-7 1.17-7 3.5V20h14v-3.5C15 14.17 10.33 13 8 13Zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.95 1.97 3.45V20h7v-3.5c0-2.33-4.67-3.5-7-3.5Z"></path>
            </svg>
        </button>
    </div>
    <div class="header-controls">
        <label class="chat-switch-label" id="chatBalanceLabel" for="chatSwitch">0 сита</label>
        <select id="chatSwitch" class="chat-switch"></select>
        <button id="logoutBtn" class="ghost-btn" type="button">Выйти</button>
    </div>
</header>

<section class="buildings-panel hidden" id="buildingsPanel">
    <div class="buildings-panel-inner">
        <div class="buildings-list" id="buildingsList"></div>
    </div>
</section>

<section class="players-panel hidden" id="playersPanel">
    <div class="players-panel-inner">
        <div class="players-search-wrap">
            <input
                id="playersSearchInput"
                class="players-search-input"
                type="text"
                autocomplete="off"
                placeholder="Поиск по имени"
                aria-label="Поиск игроков по имени или нику"
            >
            <span class="players-search-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="16.65" y1="16.65" x2="21" y2="21"></line>
                </svg>
            </span>
        </div>
        <div class="players-list" id="playersList"></div>
        <div class="players-empty hidden" id="playersEmpty">
            Игроки не найдены. Попробуйте изменить условия поиска или выберите другой чат
        </div>
    </div>
</section>

<main class="app-main">
    <section class="auth-card hidden" id="authCard">
        <h1>Сит-авторизация</h1>
        <p>Напишите боту в личные сообщения команду <code>/auth</code> и введите полученный 4-значный код.</p>
        <div class="code-auth">
            <div class="code-row">
                <input
                    id="authCodeInput"
                    class="code-input"
                    type="text"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    maxlength="4"
                    placeholder="0000"
                    aria-label="Код авторизации"
                >
            </div>
            <p class="hint" id="codeAuthHint"></p>
        </div>
    </section>
</main>

<div class="modal hidden" id="chatModal">
    <div class="modal-scrim"></div>
    <div class="modal-dialog">
        <div class="modal-title">Выберите аккаунт</div>
        <div class="chat-list" id="chatList"></div>
    </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
